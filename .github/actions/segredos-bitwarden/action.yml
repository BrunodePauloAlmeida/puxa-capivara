name: Segredos do Bitwarden
description: >-
  Lê chaves do Bitwarden Secrets Manager pelo nome e as exporta como variáveis de ambiente dos próximos passos,
  mascaradas nos logs. Falha se alguma chave pedida não existir ou estiver repetida.
inputs:
  access_token:
    description: Token da conta de máquina do Bitwarden (secret BITWARDEN_ACCESS_TOKEN do repositório)
    required: true
  chaves:
    description: Nomes das chaves no Bitwarden, separados por espaço ou quebra de linha
    required: true
  server_url:
    description: Servidor do Bitwarden; vazio usa bitwarden.com (para a nuvem europeia, https://vault.bitwarden.eu)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        BWS_ACCESS_TOKEN: ${{ inputs.access_token }}
        CHAVES: ${{ inputs.chaves }}
        BWS_SERVER_URL: ${{ inputs.server_url }}
      run: bash "$GITHUB_ACTION_PATH/ler.sh"
