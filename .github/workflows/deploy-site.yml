# Publishes the site: image in Artifact Registry, a new Cloud Run revision, and Firebase Hosting in front.
# Runs on every push to main that touches the site, or by hand (Actions > Deploy site > Run workflow).
# GitHub stores only BITWARDEN_ACCESS_TOKEN; the secrets come from Bitwarden Secrets Manager. Details: docs/deploy.md.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "firebase.json"
      - "infra/firebase/**"
      - ".github/workflows/deploy-site.yml"
      - ".github/actions/bitwarden-secrets/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

# Public configuration (not secret).
env:
  PROJECT: puxa-capivara-513419
  REGION: southamerica-east1
  SERVICE: puxa-capivara-site
  BUCKET: puxa-capivara-dados

jobs:
  deploy:
    if: github.repository == 'BrunodePauloAlmeida/puxa-capivara'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bitwarden secrets
        uses: ./.github/actions/bitwarden-secrets
        with:
          access_token: ${{ secrets.BITWARDEN_ACCESS_TOKEN }}
          server_url: ${{ vars.BWS_SERVER_URL }}
          keys: GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SA_EMAIL

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/puxa-capivara/site:$GITHUB_SHA"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" site
          docker push "$IMAGE"

      - name: New Cloud Run revision
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "puxa-site@$PROJECT.iam.gserviceaccount.com" \
            --set-env-vars "PUXA_BUCKET=$BUCKET,PUXA_PREFIX=web" \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 80 \
            --quiet

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Firebase Hosting
        run: npx --yes firebase-tools@15.34.2 deploy --only hosting --project "$PROJECT" --non-interactive

      - name: Check the site
        run: |
          for route in "/" "/api/busca?q=lula" "/ficha/lula"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://$PROJECT.web.app$route")
            echo "$code $route"
            [ "$code" = 200 ]
          done
