# Publica o site: imagem no Artifact Registry, nova revisão no Cloud Run e o Firebase Hosting na frente.
# Roda a cada push na main que mexa no site, ou à mão (Actions > Deploy do site > Run workflow).
# O GitHub guarda só o BWS_ACCESS_TOKEN; os segredos vêm do Bitwarden Secrets Manager. Detalhes: docs/deploy.md.
name: Deploy do site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "firebase.json"
      - "infra/firebase/**"
      - ".github/workflows/deploy-site.yml"
      - ".github/actions/segredos-bitwarden/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

# Configuração pública (não é segredo).
env:
  PROJETO: puxa-capivara-513419
  REGIAO: southamerica-east1
  SERVICO: puxa-capivara-site
  BUCKET: puxa-capivara-dados

jobs:
  deploy:
    if: github.repository == 'BrunodePauloAlmeida/puxa-capivara'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Segredos do Bitwarden
        uses: ./.github/actions/segredos-bitwarden
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          server_url: ${{ vars.BWS_SERVER_URL }}
          chaves: GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SA_EMAIL

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Construir e enviar a imagem
        run: |
          IMAGEM="$REGIAO-docker.pkg.dev/$PROJETO/puxa-capivara/site:$GITHUB_SHA"
          echo "IMAGEM=$IMAGEM" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGIAO-docker.pkg.dev" --quiet
          docker build -t "$IMAGEM" site
          docker push "$IMAGEM"

      - name: Nova revisão no Cloud Run
        run: |
          gcloud run deploy "$SERVICO" \
            --project "$PROJETO" \
            --region "$REGIAO" \
            --image "$IMAGEM" \
            --service-account "puxa-site@$PROJETO.iam.gserviceaccount.com" \
            --set-env-vars "PUXA_BUCKET=$BUCKET,PUXA_PREFIXO=web" \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 80 \
            --quiet

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Firebase Hosting
        run: npx --yes firebase-tools@15.34.2 deploy --only hosting --project "$PROJETO" --non-interactive

      - name: Conferir o site
        run: |
          for rota in "/" "/api/busca?q=lula" "/ficha/lula"; do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" "https://$PROJETO.web.app$rota")
            echo "$codigo $rota"
            [ "$codigo" = 200 ]
          done
