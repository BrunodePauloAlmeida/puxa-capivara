# Copia o pacote de dados do site (site-web.tar.gz, guardado com Git LFS no branch dados-site) para o
# Cloud Storage. O site lê do bucket da variável GCP_BUCKET, pasta web/.
# Rodar à mão: Actions > Publicar dados do site > Run workflow.
# Mais tarde, o pipeline no Cloud Run Job grava direto no bucket e este workflow deixa de ser necessário.
name: Publicar dados do site

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch ou commit com o site-web.tar.gz
        required: true
        default: dados-site

permissions:
  contents: read
  id-token: write

jobs:
  publicar:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          lfs: true
          path: pacote

      - name: Abrir o pacote
        run: |
          mkdir web
          tar -xzf pacote/site-web.tar.gz -C web
          test -f web/indice.json && test -f web/meta.json
          cat web/meta.json

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Sincronizar com o bucket
        env:
          PROJETO: ${{ vars.GCP_PROJECT_ID }}
          BUCKET: ${{ vars.GCP_BUCKET }}
        run: |
          gcloud storage rsync web "gs://$BUCKET/web" \
            --recursive --delete-unmatched-destination-objects --project "$PROJETO"
