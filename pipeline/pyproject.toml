[project]
name = "puxa-pipeline"
version = "0.1.0"
description = "Coleta e tratamento de dados públicos de políticos para o puxa-capivara"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "polars>=1.10",
    "pyyaml>=6.0",
    "jinja2>=3.1.6",
    "playwright>=1.50",
    "pillow>=11",
]

[project.scripts]
puxa = "puxa.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puxa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # o formatador cuida do tamanho; sobram só textos longos
